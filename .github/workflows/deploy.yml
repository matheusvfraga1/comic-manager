name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci && npm run build
        working-directory: bolao-doomsday
      - run: mkdir -p dist/bolao && cp -r bolao-doomsday/dist/. dist/bolao/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
